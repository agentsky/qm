image:
  repository: ghcr.io/yc-software/qm
  separator: "/"
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""
  annotations: {}

nameOverride: ""
fullnameOverride: ""

publicUrl: ""

env: {}

envFrom: []

secretEnv:
  CORE_SIGNING_SECRET: ""
  CAPABILITY_SECRET: ""
  PORTAL_IDENTITY_SECRET: ""
  CONNECTOR_SECRET_KEY: ""
  SKILL_SIGNING_SECRET: ""
  ANTHROPIC_API_KEY: ""
  DATABASE_URL: ""
  PUBLIC_API_URL: ""
  ADMIN_GRANTS: ""
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  SANDBOX_BACKEND: ""
  SMOLMACHINES_TOKEN: ""
  E2B_API_KEY: ""
  MODAL_TOKEN_ID: ""
  MODAL_TOKEN_SECRET: ""
  AGENT37_API_KEY: ""
  DEPLOY_PROVIDER: ""
  DEPLOY_APPS_DOMAIN: ""
  DEPLOY_GATE_SECRET: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  DROPBOX_OAUTH_CLIENT_SECRET: ""
  LINEAR_OAUTH_CLIENT_SECRET: ""
  AUTH_ALLOWED_EMAILS: ""
  AUTH_EMAIL_FROM: ""
  RESEND_API_KEY: ""

ingress:
  enabled: false
  service: core
  className: nginx
  hosts: []
  tls: true
  clusterIssuer: letsencrypt-prod
  tlsSecretName: ""
  annotations: {}

services:
  core:
    enabled: true
    image: core
    type: web
    port: 8080
    replicas: 1
    command: ["node", "src/index.ts"]
    healthPath: /healthz
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    env: {}

  egress-proxy:
    enabled: true
    image: egress-proxy
    type: worker
    port: 48080
    replicas: 1
    command: ["/app/start.sh"]
    securityContext:
      capabilities:
        add: ["NET_ADMIN"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    env: {}
