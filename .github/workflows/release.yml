name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - id: version
        name: Resolve the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "releases are cut from main; this run is on $GITHUB_REF" >&2
            exit 1
          fi
          tagged=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" -q '.[].ref' \
            | sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          base=${tagged:-0.0.0}
          IFS=. read -r major minor patch <<< "$base"
          version="$major.$minor.$((patch + 1))"
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists; refusing to move it" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  images:
    name: Images
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-package.yml

  release:
    name: Tag and publish the release
    needs:
      - preflight
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "qm-*-$GITHUB_SHA" \
            --dir artifacts
          manifest=$(jq -n '{}')
          for file in artifacts/*/qm-*.image; do
            name=${file##*/qm-}
            ref=$(tr -d '[:space:]' < "$file")
            manifest=$(printf '%s' "$manifest" | jq --arg k "${name%.image}" --arg r "$ref" '.[$k] = $r')
          done
          printf '%s\n' "$manifest" | jq . > images.json
          cat images.json
          jq -e 'length == 3 and all(.[]; test("^ghcr\\.io/yc-software/qm/[a-z-]+@sha256:[0-9a-f]{64}$"))' images.json > /dev/null \
            || { echo "no usable image digests were published for $GITHUB_SHA" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "images.json#Pinned image digests"
